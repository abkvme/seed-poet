name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  go:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Website build is up to date
        run: |
          go run ./cmd/buildweb
          git status --porcelain web/dist
          test -z "$(git status --porcelain web/dist)" || (echo "web/dist is stale: run go run ./cmd/buildweb and commit" && exit 1)
      - name: Test
        run: go test -race ./...

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Coverage of the library and its internal packages (floor 80%)
        run: |
          go test -coverprofile=coverage.out -coverpkg=./seedpoet,./internal/... ./seedpoet ./internal/...
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ {sub("%","",$3); print $3}' coverage.txt)
          echo "### Test coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit (t >= 80) ? 0 : 1 }' || (echo "coverage ${total}% is below 80%" && exit 1)
      - name: Upload to Codecov (OIDC, no secret)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Test (same poems as Go, BIP39 vectors)
        run: node --test js/

  webkit:
    name: Browser tests in WebKit (Safari engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Playwright WebKit
        run: |
          pip install playwright pypdf mnemonic
          python -m playwright install --with-deps webkit
      - name: Start local site
        run: |
          go build -o bin/seedpoet ./cmd/seedpoet
          ./bin/seedpoet serve > /tmp/seedpoet.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
      - name: e2e (WebKit)
        env:
          E2E_BROWSERS: webkit
        run: python web/tools/e2e.py http://localhost:8080

  release:
    name: Create Release
    needs: [go, js, webkit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries and website package
        run: |
          export CGO_ENABLED=0
          GOOS=linux GOARCH=amd64 go build -trimpath -o seedpoet-linux-amd64 ./cmd/seedpoet
          GOOS=linux GOARCH=arm64 go build -trimpath -o seedpoet-linux-arm64 ./cmd/seedpoet
          GOOS=darwin GOARCH=arm64 go build -trimpath -o seedpoet-darwin-arm64 ./cmd/seedpoet
          GOOS=windows GOARCH=amd64 go build -trimpath -o seedpoet-windows-amd64.exe ./cmd/seedpoet
          tar -C web/dist --sort=name --owner=0 --group=0 --numeric-owner --mtime='2026-01-01' -czf seedpoet-web.tar.gz .
          cp web/dist/seedpoet-offline.html seedpoet-offline.html
          cp js/seedpoet.js seedpoet.js
          sha256sum seedpoet-* seedpoet.js > SHA256SUMS
      - name: Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            seedpoet-*
            seedpoet.js
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
