name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -v ./cmd/bip39poem

  test:
    name: Run Tests
    needs: build
    # Run tests on main, tags, or pull requests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Test
        run: go test -v ./...

  release:
    name: Create Release
    needs: test
    # Run only on version tags
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build Binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o seedpoet-linux-amd64 ./cmd/bip39poem
          GOOS=linux GOARCH=arm64 go build -o seedpoet-linux-arm64 ./cmd/bip39poem
      - name: Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            seedpoet-linux-amd64
            seedpoet-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
