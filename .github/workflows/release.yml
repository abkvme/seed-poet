name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o seedpoet-linux-amd64 ./cmd/bip39poem
        
      - name: Build Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -o seedpoet-linux-arm64 ./cmd/bip39poem

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            seedpoet-linux-amd64
            seedpoet-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
